# Email (SMTP) - Gmail 기준, application-secret.properties에서 실제 값 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# spring.mail.username, spring.mail.password는 application-secret.properties에 설정

spring.application.name=shop
spring.profiles.active=dev

# 시크릿 파일 로드 (gitignored). 없어도 환경변수로 주입 가능하도록 optional.
spring.config.import=optional:classpath:application-secret.properties

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# JSP auto reload
server.servlet.jsp.init-parameters.development=true

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=C:/Temp/new_shop/uploads
image.upload.path=D:/shop/uploads

# ===========================================
# 결제(test) - 기본값만, 실제 값은 application-secret.properties 또는 환경변수
# ===========================================
payment.portone.imp-code=${PORTONE_IMP_CODE:imp00000000}
payment.portone.api-key=${PORTONE_API_KEY:}
payment.portone.api-secret=${PORTONE_API_SECRET:}
payment.test-mode=${PAYMENT_TEST_MODE:true}

# ===========================================
# 소셜 로그인 - 기본값만, 실제 값은 application-secret.properties 또는 환경변수
# ===========================================

# 카카오 (https://developers.kakao.com)
social.kakao.client-id=${KAKAO_CLIENT_ID:}
social.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
social.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8081/oauth/kakao/callback}

# 네이버 (https://developers.naver.com)
social.naver.client-id=${NAVER_CLIENT_ID:}
social.naver.client-secret=${NAVER_CLIENT_SECRET:}
social.naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8081/oauth/naver/callback}

# 구글 (https://console.cloud.google.com)
social.google.client-id=${GOOGLE_CLIENT_ID:}
social.google.client-secret=${GOOGLE_CLIENT_SECRET:}
social.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/oauth/google/callback}
