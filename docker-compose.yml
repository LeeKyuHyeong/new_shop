services:
  # MariaDB
  db:
    image: mariadb:10.11
    ports:
      - "3307:3306"
    container_name: khshop-db
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul  # app 은 KST 인데 db 가 UTC 라 NOW() 류 타임스탬프 9시간 엇갈림
      MYSQL_ROOT_PASSWORD: Olympus2426!
      MYSQL_DATABASE: new_kh_shop
      MYSQL_USER: root
      MYSQL_PASSWORD: Olympus2426!
    volumes:
      - khshop-db-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # healthcheck.sh 는 볼륨 init 때 생성되는 전용 계정 필요 — 구버전 init 볼륨이라 항상 unhealthy
      # → root SELECT 1 로 교체 (2026-06-05, 앱 재생성 시 depends_on 이 막히던 문제)
      test: ["CMD-SHELL", "mariadb -u root -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  # Spring Boot App
  app:
    image: positivelee/khshop-app:latest
    container_name: khshop-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    volumes:
      - khshop-uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  khshop-db-data:
  khshop-uploads: